name: Android build

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a signed release using repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Check and build
        run: ./gradlew --no-daemon ktlintCheck testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunup-debug-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build signed APK
        env:
          SUNUP_KEYSTORE_BASE64: ${{ secrets.SUNUP_KEYSTORE_BASE64 }}
          SUNUP_STORE_PASSWORD: ${{ secrets.SUNUP_STORE_PASSWORD }}
          SUNUP_KEY_ALIAS: ${{ secrets.SUNUP_KEY_ALIAS }}
          SUNUP_KEY_PASSWORD: ${{ secrets.SUNUP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUNUP_KEYSTORE_BASE64:?Missing SUNUP_KEYSTORE_BASE64}"
          : "${SUNUP_STORE_PASSWORD:?Missing SUNUP_STORE_PASSWORD}"
          : "${SUNUP_KEY_ALIAS:?Missing SUNUP_KEY_ALIAS}"
          : "${SUNUP_KEY_PASSWORD:?Missing SUNUP_KEY_PASSWORD}"
          export SUNUP_KEYSTORE_PATH="$RUNNER_TEMP/sunup-release.jks"
          trap 'rm -f "$SUNUP_KEYSTORE_PATH"' EXIT
          printf '%s' "$SUNUP_KEYSTORE_BASE64" | base64 --decode > "$SUNUP_KEYSTORE_PATH"
          chmod 600 "$SUNUP_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sunup-signed-release-${{ github.run_number }}
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk
