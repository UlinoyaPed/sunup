[versions]
android-gradle-plugin = "9.3.2"
androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-work = "2.11.2"
unifiedpush_distributor = "0.7.6"
unifiedpush_distributor_base = "0.7.6"
unifiedpush_distributor_ui = "0.7.6"
kotlin = "2.4.10"
kotlinx_serializationJson = "1.11.0"
ktlint = "14.2.0"
okhttp = "5.5.0"
composeBom = "2026.08.00"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
# BOM to library version mapping
# https://developer.android.com/develop/ui/compose/bom/bom-mapping
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3-android = { group = "androidx.compose.material3", name = "material3-android" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidx-work" }
unifiedpush-distributor = { group = "org.unifiedpush.android", name = "distributor", version.ref = "unifiedpush_distributor" }
unifiedpush-distributor-base = { group = "org.unifiedpush.android", name = "distributor-base", version.ref = "unifiedpush_distributor_base" }
unifiedpush-distributor-ui = { group = "org.unifiedpush.android", name = "distributor-ui", version.ref = "unifiedpush_distributor_ui" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx_serializationJson" }
ktlint-gradle = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint"}
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = 'org.jetbrains.kotlin.plugin.serialization', version.ref = 'kotlin' }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
